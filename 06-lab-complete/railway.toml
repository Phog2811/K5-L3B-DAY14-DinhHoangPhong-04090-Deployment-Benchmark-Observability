# Railway: build bằng Dockerfile, app nghe theo $PORT (xử lý trong CMD của Dockerfile).
# Biến AGENT_API_KEY, REDIS_URL đặt trên dashboard Railway (Variables), không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
