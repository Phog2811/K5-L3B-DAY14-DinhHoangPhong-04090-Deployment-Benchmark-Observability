# Render Blueprint: web service (Docker) + Redis (Key Value) cùng một file.
# AGENT_API_KEY dùng sync: false → nhập trên dashboard lúc tạo, không ghi giá trị ở đây.
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []
